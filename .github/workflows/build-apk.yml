name: Build TradePluss Widget APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          mkdir -p app/src/main/res/font
          BASE="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf"
          curl -fsSL "$BASE/Vazirmatn-Regular.ttf" -o app/src/main/assets/fonts/vazirmatn_regular.ttf
          curl -fsSL "$BASE/Vazirmatn-Medium.ttf" -o app/src/main/assets/fonts/vazirmatn_medium.ttf
          curl -fsSL "$BASE/Vazirmatn-Bold.ttf" -o app/src/main/assets/fonts/vazirmatn_bold.ttf
          # also copy to res/font for XML fontFamily fallback
          cp app/src/main/assets/fonts/vazirmatn_regular.ttf app/src/main/res/font/vazirmatn_regular.ttf
          cp app/src/main/assets/fonts/vazirmatn_medium.ttf app/src/main/res/font/vazirmatn_medium.ttf
          cp app/src/main/assets/fonts/vazirmatn_bold.ttf app/src/main/res/font/vazirmatn_bold.ttf
          ls -la app/src/main/assets/fonts/
          ls -la app/src/main/res/font/

      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.5
            chmod +x ./gradlew
          else
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TradePluss-Widget-v1.0.0.apk
          ls -la dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradePluss-Widget-v1.0.0
          path: dist/TradePluss-Widget-v1.0.0.apk
          retention-days: 90
